<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>unity</title>
  <meta name="theme-color" content="#E87FA0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #e87fa0;
      --card: rgba(255,255,255,0.11);
      --border: rgba(255,255,255,0.16);
      --text: #f2f2f2;
      --muted: rgba(242,242,242,0.7);
      --glass: blur(28px) saturate(1.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%; overflow:hidden;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background:#080808; color:var(--text);
    }

    .bg {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0;
    }
    .dim {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.32));
    }

    /* Splash */
    .splash {
      position:fixed; inset:0; z-index:30;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.25); backdrop-filter:blur(2px);
      cursor:pointer; transition:opacity .4s, visibility .4s;
    }
    .splash.hide { opacity:0; visibility:hidden; pointer-events:none; }
    .splash span {
      font-size:clamp(1.15rem,3.5vw,1.55rem);
      font-weight:500; color:#fff; letter-spacing:.02em;
      text-shadow:0 2px 18px rgba(0,0,0,.5);
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{ opacity:.8; }
      50%{ opacity:1; }
    }

    /* Top controls */
    .top {
      position:fixed; top:1rem; left:1rem; right:1rem;
      display:flex; justify-content:space-between; z-index:15;
      opacity:0; transition:opacity .5s .2s;
    }
    .top.show { opacity:1; }
    .ic {
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,255,255,.12); backdrop-filter:var(--glass);
      border:1px solid rgba(255,255,255,.14);
      display:flex; align-items:center; justify-content:center;
      color:#fff; cursor:pointer; transition:all .18s;
    }
    .ic:hover { background:rgba(255,255,255,.22); transform:scale(1.06); }
    .ic svg { width:17px; height:17px; }
    .ic.purple { background:rgba(140,80,220,.35); border-color:rgba(160,100,240,.3); }
    .ic.purple:hover { background:rgba(140,80,220,.5); }

    /* Page */
    .page {
      position:relative; z-index:2; height:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:1.25rem; opacity:0;
      transform:translateY(12px);
      transition:opacity .5s ease, transform .5s ease;
    }
    .page.show { opacity:1; transform:none; }

    /* Card */
    .card {
      width:min(400px, 94vw);
      background:var(--card);
      backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
      border:1px solid var(--border);
      border-radius:22px;
      padding:1.25rem 1.15rem 1.05rem;
      box-shadow:0 8px 36px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07);
    }

    .row1 {
      display:flex; gap:.9rem; align-items:flex-start;
      margin-bottom:.95rem;
    }
    .av-wrap {
      position:relative; width:78px; height:78px; flex-shrink:0;
    }
    .av {
      width:78px; height:78px; border-radius:50%; object-fit:cover;
      border:2px solid rgba(255,255,255,.35);
      box-shadow:0 3px 16px rgba(0,0,0,.3);
    }
    .deco {
      position:absolute; inset:-12px;
      width:calc(100% + 24px); height:calc(100% + 24px);
      object-fit:contain; pointer-events:none;
      animation:float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-2.5px); }
    }

    .meta { flex:1; min-width:0; padding-top:.2rem; }
    .uname {
      font-size:1.35rem; font-weight:600; letter-spacing:-.02em;
      margin-bottom:.3rem; color:#fff;
    }
    .bio {
      font-size:.8rem; line-height:1.45; color:var(--muted);
      min-height:2.9em;
    }
    .bio .cursor {
      display:inline-block; color:var(--accent);
      font-weight:500; animation:blink .8s step-end infinite;
    }
    @keyframes blink { 50%{ opacity:0; } }

    /* Widgets */
    .wids {
      display:flex; gap:.5rem; margin-bottom:.75rem;
    }
    .wid {
      flex:1; background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08); border-radius:12px;
      padding:.5rem .55rem; display:flex; align-items:center; gap:.45rem;
      text-decoration:none; color:inherit; min-width:0;
      transition:background .18s, border-color .18s, transform .18s;
    }
    .wid:hover {
      background:rgba(0,0,0,.32);
      border-color:rgba(255,255,255,.14);
      transform:translateY(-1px);
    }
    .w-ic { width:32px; height:32px; border-radius:8px; object-fit:cover; flex-shrink:0; }
    .w-b { min-width:0; flex:1; overflow:hidden; }
    .w-t { font-size:.74rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .w-s { font-size:.62rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
    .dot {
      display:inline-block; width:6px; height:6px; border-radius:50%;
      background:#23a55a; margin-right:3px; vertical-align:middle;
      box-shadow:0 0 5px #23a55a;
    }
    .join {
      font-size:.58rem; font-weight:600; margin-top:.15rem;
      background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12);
      border-radius:4px; padding:.12rem .32rem; display:inline-block; color:#fff;
    }
    .ml {
      width:24px; height:24px; border-radius:5px; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:.9rem; color:#000; flex-shrink:0;
    }

    .views {
      display:flex; align-items:center; gap:.25rem;
      font-size:.68rem; color:var(--muted); margin-bottom:.65rem;
    }
    .views svg { width:12px; height:12px; opacity:.7; }

    /* Player */
    .player {
      background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.08);
      border-radius:14px; padding:.55rem .7rem;
      display:flex; align-items:center; gap:.6rem;
    }
    .cover { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
    .pi { flex:1; min-width:0; }
    .pt { font-size:.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pa { font-size:.66rem; color:var(--muted); margin-top:1px; }
    .pr { display:flex; align-items:center; gap:.3rem; margin-top:.28rem; }
    .play {
      width:26px; height:26px; border-radius:50%;
      background:rgba(255,255,255,.15); border:none;
      display:flex; align-items:center; justify-content:center;
      color:#fff; cursor:pointer; flex-shrink:0; transition:all .15s;
    }
    .play:hover { background:rgba(255,255,255,.28); transform:scale(1.08); }
    .play svg { width:11px; height:11px; }
    .bw { flex:1; display:flex; align-items:center; gap:.28rem; min-width:0; }
    .tm { font-size:.58rem; color:var(--muted); font-variant-numeric:tabular-nums; min-width:24px; }
    .bar {
      flex:1; height:3.5px; background:rgba(255,255,255,.12);
      border-radius:2px; cursor:pointer; overflow:hidden;
    }
    .fill {
      height:100%; width:0%;
      background:linear-gradient(90deg, var(--accent), #f0a0b8);
      border-radius:2px;
    }

    /* Lyrics — subtle, near player */
    .lyrics {
      margin-top:.55rem;
      font-size:.72rem; color:rgba(255,255,255,.45);
      text-align:center; line-height:1.4;
      min-height:1.4em;
      transition:opacity .35s, color .35s;
      opacity:0;
    }
    .lyrics.show { opacity:1; }
    .lyrics.active { color:rgba(255,255,255,.85); }

    /* Bottom actions */
    .acts {
      position:fixed; bottom:1.2rem; right:1.2rem;
      display:flex; gap:.4rem; z-index:12;
      opacity:0; transition:opacity .5s .3s;
    }
    .acts.show { opacity:1; }
    .act {
      width:38px; height:38px; border-radius:50%;
      background:rgba(255,255,255,.09); backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.1);
      display:flex; align-items:center; justify-content:center;
      color:rgba(255,255,255,.55); cursor:pointer; transition:all .18s;
    }
    .act:hover { background:rgba(255,255,255,.18); color:#fff; }
    .act.on { color:var(--accent); }

    @media (max-width:480px) {
      .card { padding:1.1rem 1rem .95rem; border-radius:18px; }
      .av-wrap,.av { width:70px; height:70px; }
      .deco { inset:-10px; width:calc(100% + 20px); height:calc(100% + 20px); }
      .uname { font-size:1.2rem; }
      .wids { flex-direction:column; }
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4" />
  </video>
  <div class="dim"></div>

  <div class="splash" id="splash"><span>Click to enter</span></div>

  <div class="top" id="top">
    <button class="ic purple" id="muteBtn" title="Mute">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <button class="ic purple" title="Share" onclick="navigator.share?.({title:'unity',url:location.href})||navigator.clipboard.writeText(location.href)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
    </button>
  </div>

  <div class="page" id="page">
    <div class="card">
      <div class="row1">
        <div class="av-wrap">
          <img class="av" src="avatar.png" alt="unity" />
          <img class="deco" src="decoration.png" alt="" />
        </div>
        <div class="meta">
          <div class="uname">unity</div>
          <div class="bio" id="bio"></div>
        </div>
      </div>

      <div class="wids">
        <a class="wid" href="https://discord.gg/" target="_blank" rel="noopener">
          <img class="w-ic" src="https://cdn.discordapp.com/icons/1450293836210372784/7ec8af0717196d538c83e68c9c30acbf.png?size=128" alt="" />
          <div class="w-b">
            <div class="w-t">.lolZ</div>
            <div class="w-s"><span class="dot"></span>15 online · 42 members</div>
            <span class="join">Join Server</span>
          </div>
        </a>
        <a class="wid" href="#" target="_blank" rel="noopener">
          <img class="w-ic" src="https://cdn.discordapp.com/avatars/1443807588864098316/75ac82e5b0f5ea3802dde7f8a87c39f8.png?size=256" alt="" />
          <div class="w-b">
            <div class="w-t">ty_da_modda</div>
            <div class="w-s">Medium · Writing a script</div>
          </div>
          <div class="ml">M</div>
        </a>
      </div>

      <div class="views">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span>6</span>
      </div>

      <div class="player">
        <img class="cover" src="cover.jpg" alt="" />
        <div class="pi">
          <div class="pt">Blue Bands</div>
          <div class="pa">Weiland</div>
          <div class="pr">
            <button class="play" id="playBtn">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="bw">
              <span class="tm" id="cur">0:00</span>
              <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
              <span class="tm" id="dur">2:39</span>
            </div>
          </div>
        </div>
      </div>

      <div class="lyrics" id="lyrics"></div>
    </div>
  </div>

  <div class="acts" id="acts">
    <button class="act" id="likeBtn" title="Like">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
    </button>
    <button class="act" title="Dislike">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
    </button>
  </div>

  <audio id="audio" src="blue-bands.mp3" preload="auto" loop></audio>

  <script>
    const BIO = "Im 14 years old I like listening to music, I love cats I play sports im also a 2 year unity dev and ive been a modder for 2 years i fw all my friends";
    const LYRICS = [
      "Your shooter, he a decoy",
      "I send the packs and then I deploy (Then I deploy)",
      "I just came home with some new toys (With some new)",
      "I sniff the loud and it just reek",
      "I jus—",
      "Blue bands, blue bands, blue bands",
      "Blue bands, blue bands, blue bands",
      "Check my pants, they say, \"True,\" man (They say, \"True,\" man)",
      "Blue bands, blue bands, blue bands",
      "Check my pants, they say, \"True,\" man",
      "Blue bands, blue bands, blue bands",
      "Check my pants, they say, \"True,\" man (They say, \"True\")",
      "Blue bands, blue bands, blue bands (Blue bands)",
      "Check my pants, they say, \"True,\" man (They say, \"True,\" man)",
      "I'm flexin' all these blue bands (Blue bands)",
      "I'm flexin' in my True pants (My True pants)",
      "These Margielas make you dance, man (Maison Margiela)",
      "These 50's on my hip, boy (Hip, boy)",
      "Your shooter, he a decoy",
      "I send the packs and then I deploy (Then I deploy)",
      "I just came home with some new toys (With some new)",
      "I sniff the loud and it just reek",
      "I just spent 10K to shine my teeth (Bling)",
      "Y-3's restin' on my feet (Yo, I'm shinin')",
      "She served me neck just last week (Sloppy toppy)",
      "We flex so hard, got leather seats (I'm flexin')",
      "Blue bands, blue bands, blue bands",
      "Check my pants, they say, \"True,\" man (They say, \"True,\" man)",
      "Blue bands, blue bands, blue bands (Blue)",
      "Check my pants, they say, \"True,\" man"
    ];

    const audio = document.getElementById('audio');
    const splash = document.getElementById('splash');
    const page = document.getElementById('page');
    const top = document.getElementById('top');
    const acts = document.getElementById('acts');
    const bioEl = document.getElementById('bio');
    const lyricsEl = document.getElementById('lyrics');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const fill = document.getElementById('fill');
    const cur = document.getElementById('cur');
    const dur = document.getElementById('dur');
    const bar = document.getElementById('bar');
    const likeBtn = document.getElementById('likeBtn');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');

    let entered = false, liked = false, typed = 0;

    // Typewriter that shows .py suffix like the real site
    function typeBio() {
      typed = 0;
      function tick() {
        if (typed <= BIO.length) {
          const shown = BIO.slice(0, typed);
          bioEl.innerHTML = shown + '<span class="cursor">.py</span>';
          typed++;
          setTimeout(tick, 22 + Math.random() * 18);
        } else {
          // keep .py blinking briefly then settle
          setTimeout(() => {
            bioEl.innerHTML = BIO;
          }, 1800);
        }
      }
      tick();
    }

    function fmt(s) {
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    function updateLyrics() {
      if (!audio.duration) return;
      const idx = Math.min(
        Math.floor((audio.currentTime / audio.duration) * LYRICS.length),
        LYRICS.length - 1
      );
      lyricsEl.textContent = LYRICS[idx] || '';
      lyricsEl.classList.add('active');
    }

    audio.addEventListener('loadedmetadata', () => {
      dur.textContent = fmt(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      cur.textContent = fmt(audio.currentTime);
      updateLyrics();
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    });

    bar.addEventListener('click', e => {
      if (!audio.duration) return;
      const r = bar.getBoundingClientRect();
      audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      muteIcon.innerHTML = audio.muted
        ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    });

    likeBtn.addEventListener('click', () => {
      liked = !liked;
      likeBtn.classList.toggle('on', liked);
    });

    splash.addEventListener('click', () => {
      if (entered) return;
      entered = true;
      splash.classList.add('hide');
      page.classList.add('show');
      top.classList.add('show');
      acts.classList.add('show');
      lyricsEl.classList.add('show');
      typeBio();
      setTimeout(() => {
        audio.play().then(() => {
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }).catch(() => {});
      }, 1200);
    });
  </script>
</body>
</html>
